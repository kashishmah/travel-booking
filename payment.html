<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment - TravelEase</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/booking.css">

</head>

<body>

<header class="navbar">

    <a href="index.html"
       class="logo">
        TravelEase
    </a>

</header>


<main class="booking-page">

    <div class="booking-container">


        <section>

            <h1>Payment</h1>


            <div class="steps">

                <span>
                    ✓ Guest details
                </span>

                <span class="active">
                    2 Payment
                </span>

                <span>
                    3 Confirmation
                </span>

            </div>


            <form
                id="paymentForm"
                class="booking-form">

                <h2>Choose payment method</h2>


                <div class="payment-methods">

                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="card"
                            checked>

                        Credit / Debit Card

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="upi">

                        UPI

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="payment"
                            value="cash">

                        Pay at property

                    </label>

                </div>


                <div id="cardDetails">

                    <label>
                        Cardholder name
                    </label>

                    <input
                        type="text"
                        id="cardName"
                        placeholder="Name on card">


                    <label>
                        Card number
                    </label>

                    <input
                        type="text"
                        id="cardNumber"
                        placeholder="1234 5678 9012 3456"
                        maxlength="19">


                    <div class="form-grid">

                        <div>

                            <label>
                                Expiry
                            </label>

                            <input
                                type="text"
                                placeholder="MM/YY">

                        </div>


                        <div>

                            <label>
                                CVV
                            </label>

                            <input
                                type="password"
                                placeholder="123"
                                maxlength="3">

                        </div>

                    </div>

                </div>


                <button
                    class="primary-button"
                    type="submit">

                    Pay & Confirm Booking

                </button>

                <p class="demo-payment">
                    This is a demo payment system.
                    No real money will be charged.
                </p>

            </form>

        </section>


        <aside id="paymentSummary"
               class="booking-summary">
        </aside>

    </div>

</main>


<script src="js/payment.js"></script>

</body>

</html>
